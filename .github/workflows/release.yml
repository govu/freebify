name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Each matrix job creates the release up front with `|| true`: the first to
  # land wins, the rest fail benignly and electron-builder --publish uploads
  # into the same release. No separate create-release job — under runner
  # starvation a serial gate doubled the wait while doing nothing.
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Ensure release exists
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --verify-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # AppImageTool needs FUSE — ubuntu runners don't ship libfuse2
      - name: Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      # platform-aware: yt-dlp.exe on Windows, unix yt-dlp on macOS/Linux
      - run: npm run fetch-bin

      # builds dist/ then electron-builder; --publish always uploads artifacts
      # + latest.yml / latest-mac.yml into the release for this tag
      - name: Build & publish
        run: node scripts/sync-site-version.mjs && npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no Apple/cert signing — skip cert discovery instead of failing.
          # (do NOT set CSC_LINK — an empty value is still read as a cert path)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
