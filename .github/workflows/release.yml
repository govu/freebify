name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # platform-aware: yt-dlp.exe on Windows, yt-dlp (universal mac binary) on macOS
      - run: npm run fetch-bin

      # builds dist/ then electron-builder; --publish always uploads artifacts
      # + latest.yml / latest-mac.yml into the release for this tag
      - name: Build & publish
        run: node scripts/sync-site-version.mjs && npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no Apple/cert signing — skip cert discovery instead of failing
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ""
